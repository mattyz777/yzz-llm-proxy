[package]
name = "yzz-llm-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
async-trait = "0.1.92"
axum = "0.8.9"
bytes = "1.12.1"
chrono = "0.4.45"
dirs = "6.0.0"
dotenvy = "0.15.7"
futures-util = "0.3.33"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls", "multipart", "query"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
toml = "1.1.4"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.24.0", features = ["v4"] }
